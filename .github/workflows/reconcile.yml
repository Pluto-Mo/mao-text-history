name: Reconcile catalogue encodings and mappings
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Catalogue acquisition and evidence audit']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/workflows/reconcile.yml']
permissions:
  contents: write
concurrency:
  group: catalogue-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - id: ready
        name: Require initial observation records
        run: |
          if test -f reports/coverage.json; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Initial acquisition has not committed its observations; its completion event will trigger reconciliation.'
          fi
      - name: Reconcile source catalogues
        if: steps.ready.outputs.ready == 'true'
        run: python catalogue_v2.py
      - name: Verify corrected data
        if: steps.ready.outputs.ready == 'true'
        run: python -m unittest discover -s tests -v
      - name: Commit audited metadata
        if: steps.ready.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog reports
          git diff --cached --quiet && exit 0
          git commit -m 'data: reconcile Chinese decoding, volume columns and title mappings'
          git pull --rebase origin main
          git push origin HEAD:main
