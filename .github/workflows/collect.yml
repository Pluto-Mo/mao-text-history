name: Catalogue acquisition and evidence audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'corpus.py'
      - 'config/**'
      - '.github/workflows/collect.yml'
permissions:
  contents: write
concurrency:
  group: catalogue-acquisition
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Install parser
        run: python -m pip install -r requirements.txt
      - name: Test before network operations
        run: python -m unittest discover -s tests -v
      - name: Catalogue sources and check HTML witnesses
        run: python corpus.py collect --limit 1500 --workers 3
      - name: Validate generated provenance
        run: python corpus.py validate
      - name: Commit only public metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: record catalogue entries, acquisition receipts and candidate mappings'
          git pull --rebase origin main
          git push origin HEAD:main
